<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" preserveAspectRatio="xMidYMid meet" aria-label="Twelve tiles, one per check group, each with its own muted hue and its check count: Transport and certificates 3, Name system 6, Response headers 3, Email 1, Infrastructure 5, Reconnaissance 2, Privacy 1, Content and accessibility 1, Performance 2, Search and preview 1, Reputation 6, Interface friction 1, totalling 32 checks.">
  <title>The twelve check groups, at a glance</title>

  <style>
    /* A slow, staggered lift on each accent bar. It draws the eye across the
       grid without claiming any state. */
    .tile-bar { animation: tile-breathe 6s ease-in-out infinite; }
    .d1 { animation-delay: 0s; }    .d2 { animation-delay: 0.25s; }
    .d3 { animation-delay: 0.5s; }  .d4 { animation-delay: 0.75s; }
    .d5 { animation-delay: 1s; }    .d6 { animation-delay: 1.25s; }
    .d7 { animation-delay: 1.5s; }  .d8 { animation-delay: 1.75s; }
    .d9 { animation-delay: 2s; }    .d10 { animation-delay: 2.25s; }
    .d11 { animation-delay: 2.5s; } .d12 { animation-delay: 2.75s; }
    @keyframes tile-breathe {
      0%, 100% { opacity: 0.55; }
      50%      { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .tile-bar { animation: none; opacity: 0.85; }
    }
  </style>

  <defs>
    <linearGradient id="cat-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080c10"/>
      <stop offset="1" stop-color="#101820"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" fill="url(#cat-bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="419" fill="none" stroke="#1c2730"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="40" y="44" fill="#5c6879" font-size="12" letter-spacing="1.6">TWELVE GROUPS, 32 CHECKS</text>
    <text x="40" y="70" fill="#a7b3c2" font-size="14">Each group is one question about the host. The hue is the group's own, used across the site.</text>
  </g>

  <!-- Row 1: transport, dns, headers, email -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <g transform="translate(40 92)">
      <rect width="270" height="90" rx="10" fill="#10151c" stroke="#1c2730"/>
      <rect class="tile-bar d1" width="4" height="90" rx="2" fill="#4fb3a3"/>
      <text x="20" y="32" fill="#e8ecf2" font-size="14.5" font-weight="600">Transport and certificates</text>
      <text x="20" y="54" fill="#94a1b2" font-size="11.5">CT logs, revocation, redirects</text>
      <text x="20" y="76" fill="#4fb3a3" font-size="12" font-weight="600">3 checks</text>
    </g>
    <g transform="translate(330 92)">
      <rect width="270" height="90" rx="10" fill="#10151c" stroke="#1c2730"/>
      <rect class="tile-bar d2" width="4" height="90" rx="2" fill="#5a9fd4"/>
      <text x="20" y="32" fill="#e8ecf2" font-size="14.5" font-weight="600">Name system</text>
      <text x="20" y="54" fill="#94a1b2" font-size="11.5">Records, DNSSEC, registration</text>
      <text x="20" y="76" fill="#5a9fd4" font-size="12" font-weight="600">6 checks</text>
    </g>
    <g transform="translate(620 92)">
      <rect width="270" height="90" rx="10" fill="#10151c" stroke="#1c2730"/>
      <rect class="tile-bar d3" width="4" height="90" rx="2" fill="#7c9cc4"/>
      <text x="20" y="32" fill="#e8ecf2" font-size="14.5" font-weight="600">Response headers</text>
      <text x="20" y="54" fill="#94a1b2" font-size="11.5">CSP, HSTS, edge, security.txt</text>
      <text x="20" y="76" fill="#7c9cc4" font-size="12" font-weight="600">3 checks</text>
    </g>
    <g transform="translate(910 92)">
      <rect width="270" height="90" rx="10" fill="#10151c" stroke="#1c2730"/>
      <rect class="tile-bar d4" width="4" height="90" rx="2" fill="#c2965e"/>
      <text x="20" y="32" fill="#e8ecf2" font-size="14.5" font-weight="600">Email</text>
      <text x="20" y="54" fill="#94a1b2" font-size="11.5">SPF, DKIM, DMARC, MTA-STS</text>
      <text x="20" y="76" fill="#c2965e" font-size="12" font-weight="600">1 check</text>
    </g>

    <!-- Row 2: infrastructure, recon, privacy, content -->
    <g transform="translate(40 198)">
      <rect width="270" height="90" rx="10" fill="#10151c" stroke="#1c2730"/>
      <rect class="tile-bar d5" width="4" height="90" rx="2" fill="#c07f5e"/>
      <text x="20" y="32" fill="#e8ecf2" font-size="14.5" font-weight="600">Infrastructure</text>
      <text x="20" y="54" fill="#94a1b2" font-size="11.5">Hosting, ports, stack, exposure</text>
      <text x="20" y="76" fill="#c07f5e" font-size="12" font-weight="600">5 checks</text>
    </g>
    <g transform="translate(330 198)">
      <rect width="270" height="90" rx="10" fill="#10151c" stroke="#1c2730"/>
      <rect class="tile-bar d6" width="4" height="90" rx="2" fill="#4fb8c4"/>
      <text x="20" y="32" fill="#e8ecf2" font-size="14.5" font-weight="600">Reconnaissance</text>
      <text x="20" y="54" fill="#94a1b2" font-size="11.5">Subdomains, address lookups</text>
      <text x="20" y="76" fill="#4fb8c4" font-size="12" font-weight="600">2 checks</text>
    </g>
    <g transform="translate(620 198)">
      <rect width="270" height="90" rx="10" fill="#10151c" stroke="#1c2730"/>
      <rect class="tile-bar d7" width="4" height="90" rx="2" fill="#6ea89b"/>
      <text x="20" y="32" fill="#e8ecf2" font-size="14.5" font-weight="600">Privacy</text>
      <text x="20" y="54" fill="#94a1b2" font-size="11.5">Cookies and trackers</text>
      <text x="20" y="76" fill="#6ea89b" font-size="12" font-weight="600">1 check</text>
    </g>
    <g transform="translate(910 198)">
      <rect width="270" height="90" rx="10" fill="#10151c" stroke="#1c2730"/>
      <rect class="tile-bar d8" width="4" height="90" rx="2" fill="#6cb883"/>
      <text x="20" y="32" fill="#e8ecf2" font-size="14.5" font-weight="600">Content and accessibility</text>
      <text x="20" y="54" fill="#94a1b2" font-size="11.5">Headings, labels, markup</text>
      <text x="20" y="76" fill="#6cb883" font-size="12" font-weight="600">1 check</text>
    </g>

    <!-- Row 3: performance, seo, threat, ux -->
    <g transform="translate(40 304)">
      <rect width="270" height="84" rx="10" fill="#10151c" stroke="#1c2730"/>
      <rect class="tile-bar d9" width="4" height="84" rx="2" fill="#c9a94e"/>
      <text x="20" y="30" fill="#e8ecf2" font-size="14.5" font-weight="600">Performance</text>
      <text x="20" y="52" fill="#94a1b2" font-size="11.5">Page weight, energy estimate</text>
      <text x="20" y="72" fill="#c9a94e" font-size="12" font-weight="600">2 checks</text>
    </g>
    <g transform="translate(330 304)">
      <rect width="270" height="84" rx="10" fill="#10151c" stroke="#1c2730"/>
      <rect class="tile-bar d10" width="4" height="84" rx="2" fill="#8aa87a"/>
      <text x="20" y="30" fill="#e8ecf2" font-size="14.5" font-weight="600">Search and preview</text>
      <text x="20" y="52" fill="#94a1b2" font-size="11.5">Crawlability, canonical, sitemap</text>
      <text x="20" y="72" fill="#8aa87a" font-size="12" font-weight="600">1 check</text>
    </g>
    <g transform="translate(620 304)">
      <rect width="270" height="84" rx="10" fill="#10151c" stroke="#1c2730"/>
      <rect class="tile-bar d11" width="4" height="84" rx="2" fill="#cf7d80"/>
      <text x="20" y="30" fill="#e8ecf2" font-size="14.5" font-weight="600">Reputation</text>
      <text x="20" y="52" fill="#94a1b2" font-size="11.5">Threat feeds, listings, archive</text>
      <text x="20" y="72" fill="#cf7d80" font-size="12" font-weight="600">6 checks</text>
    </g>
    <g transform="translate(910 304)">
      <rect width="270" height="84" rx="10" fill="#10151c" stroke="#1c2730"/>
      <rect class="tile-bar d12" width="4" height="84" rx="2" fill="#b09a6e"/>
      <text x="20" y="30" fill="#e8ecf2" font-size="14.5" font-weight="600">Interface friction</text>
      <text x="20" y="52" fill="#94a1b2" font-size="11.5">Pre-ticked consent, guilt copy</text>
      <text x="20" y="72" fill="#b09a6e" font-size="12" font-weight="600">1 check</text>
    </g>
  </g>

  <text x="40" y="408" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#5c6879" font-size="11">Hues are the site's own group colours. Counts are read from the check registry, so they cannot drift from the product.</text>
</svg>
