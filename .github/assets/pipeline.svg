<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="A scan runs in three steps: the browser asks public sources, checks resolve one at a time, and a report is produced">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#4fd1c5" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#4fd1c5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
    <style>
      text {
        font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif;
      }
      .mono {
        font-family: "JetBrains Mono", SFMono-Regular, Menlo, monospace;
      }
      .panel {
        fill: #10151c;
        stroke: #ffffff;
        stroke-opacity: 0.08;
      }
      .title {
        fill: #e8ecf2;
        font-size: 17px;
        font-weight: 600;
      }
      .sub {
        fill: #94a1b2;
        font-size: 13px;
      }
      .row {
        fill: #aab5c3;
        font-size: 13.5px;
      }
      .chip {
        fill: #161d26;
        stroke: #ffffff;
        stroke-opacity: 0.06;
      }
      .chip-text {
        fill: #8d99a9;
        font-size: 11px;
      }
      .wire {
        stroke: #2b3543;
        stroke-width: 1.5;
      }
      .fade {
        animation: fade 0.55s ease-out both;
      }
      .resolve {
        animation: resolve 0.45s ease-out both;
      }
      .rail-fill {
        transform-box: fill-box;
        transform-origin: 0 50%;
        animation: rail 5.6s ease-in-out infinite;
      }
      @keyframes fade {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes resolve {
        from { opacity: 0; transform: translateX(-8px); }
        to { opacity: 1; transform: translateX(0); }
      }
      @keyframes rail {
        0% { transform: scaleX(0); }
        55% { transform: scaleX(1); }
        85% { transform: scaleX(1); }
        86% { transform: scaleX(0); }
        100% { transform: scaleX(0); }
      }
      @media (prefers-reduced-motion: reduce) {
        .motion { display: none; }
        .fade, .resolve { animation: none; }
        .rail-fill { animation: none; transform: scaleX(1); }
      }
    </style>
  </defs>

  <rect width="1200" height="260" fill="#0b0e13"/>
  <rect width="1200" height="260" fill="url(#grid)"/>
  <ellipse cx="600" cy="140" rx="520" ry="140" fill="url(#glow)"/>

  <text x="48" y="30" class="mono" font-size="11" letter-spacing="2.5" fill="#5c6878">SCAN FLOW</text>

  <!-- Step one: the browser, and the public sources it queries directly. -->
  <g class="fade" style="animation-delay:.05s">
    <rect x="48" y="48" width="212" height="176" rx="12" class="panel"/>
    <text x="72" y="82" class="title">Browser</text>
    <text x="72" y="102" class="sub">asks public sources</text>

    <g class="mono">
      <rect x="64" y="114" width="140" height="22" rx="6" class="chip"/>
      <text x="76" y="129" class="chip-text">DNS over HTTPS</text>

      <rect x="64" y="140" width="140" height="22" rx="6" class="chip"/>
      <text x="76" y="155" class="chip-text">certificate logs</text>

      <rect x="64" y="166" width="140" height="22" rx="6" class="chip"/>
      <text x="76" y="181" class="chip-text">response headers</text>

      <rect x="64" y="192" width="140" height="22" rx="6" class="chip"/>
      <text x="76" y="207" class="chip-text">the page itself</text>
    </g>
  </g>

  <!-- Connector one, with a dot travelling along it. -->
  <g class="fade" style="animation-delay:.25s">
    <line x1="260" y1="136" x2="384" y2="136" class="wire"/>
    <polygon points="384,131 392,136 384,141" fill="#33404f"/>
    <text x="326" y="126" class="mono" font-size="10.5" fill="#5c6878" text-anchor="middle">public data</text>
  </g>
  <g class="motion">
    <g transform="translate(260,136)">
      <circle r="3.5" fill="#4fd1c5">
        <animateMotion dur="2.6s" repeatCount="indefinite" path="M0,0 L124,0"/>
      </circle>
      <circle r="2.2" fill="#4fd1c5" fill-opacity="0.45">
        <animateMotion dur="2.6s" begin="1.3s" repeatCount="indefinite" path="M0,0 L124,0"/>
      </circle>
    </g>
  </g>

  <!-- Step two: checks resolving one at a time. -->
  <g class="fade" style="animation-delay:.35s">
    <rect x="392" y="48" width="372" height="176" rx="12" class="panel"/>
    <text x="416" y="82" class="title">Checks</text>
    <text x="416" y="102" class="sub">resolve one at a time</text>

    <g class="resolve" style="animation-delay:.55s">
      <circle cx="416" cy="124" r="4.5" fill="#56c98a"/>
      <text x="432" y="128" class="row">dns records</text>
      <text x="740" y="128" class="mono" font-size="10.5" fill="#56c98a" text-anchor="end">pass</text>
    </g>

    <g class="resolve" style="animation-delay:.70s">
      <circle cx="416" cy="146" r="4.5" fill="#56c98a"/>
      <text x="432" y="150" class="row">certificates</text>
      <text x="740" y="150" class="mono" font-size="10.5" fill="#56c98a" text-anchor="end">pass</text>
    </g>

    <g class="resolve" style="animation-delay:.85s">
      <circle cx="416" cy="168" r="4.5" fill="#e0a33a"/>
      <text x="432" y="172" class="row">response headers</text>
      <text x="740" y="172" class="mono" font-size="10.5" fill="#e0a33a" text-anchor="end">warn</text>
    </g>

    <g class="resolve" style="animation-delay:1.00s">
      <circle cx="416" cy="190" r="4.5" fill="#ef6a72"/>
      <text x="432" y="194" class="row">email auth</text>
      <text x="740" y="194" class="mono" font-size="10.5" fill="#ef6a72" text-anchor="end">fail</text>
    </g>

    <g class="resolve" style="animation-delay:1.15s">
      <circle cx="416" cy="212" r="4.5" fill="#5aa9e6"/>
      <text x="432" y="216" class="row">privacy</text>
      <text x="740" y="216" class="mono" font-size="10.5" fill="#5aa9e6" text-anchor="end">info</text>
    </g>
  </g>

  <!-- Connector two. -->
  <g class="fade" style="animation-delay:1.30s">
    <line x1="764" y1="136" x2="884" y2="136" class="wire"/>
    <polygon points="884,131 892,136 884,141" fill="#33404f"/>
    <text x="828" y="126" class="mono" font-size="10.5" fill="#5c6878" text-anchor="middle">results</text>
  </g>
  <g class="motion">
    <g transform="translate(764,136)">
      <circle r="3.5" fill="#4fd1c5">
        <animateMotion dur="2.6s" begin="0.8s" repeatCount="indefinite" path="M0,0 L120,0"/>
      </circle>
    </g>
  </g>

  <!-- Step three: the report, with a rail that fills as the checks settle. -->
  <g class="fade" style="animation-delay:1.45s">
    <rect x="892" y="48" width="260" height="176" rx="12" class="panel"/>
    <text x="916" y="82" class="title">Report</text>
    <text x="916" y="102" class="sub">evidence and gaps</text>

    <rect x="916" y="116" width="212" height="6" rx="3" fill="#1b232e"/>
    <rect x="916" y="116" width="212" height="6" rx="3" fill="#4fd1c5" class="rail-fill"/>

    <g>
      <circle cx="920" cy="148" r="4.5" fill="#56c98a"/>
      <text x="934" y="152" class="row">what passed</text>
    </g>
    <g>
      <circle cx="920" cy="176" r="4.5" fill="#ef6a72"/>
      <text x="934" y="180" class="row">what failed</text>
    </g>
    <g>
      <circle cx="920" cy="204" r="4.5" fill="#7b8798"/>
      <text x="934" y="208" class="row">what could not run</text>
    </g>
  </g>

  <text x="600" y="248" class="mono" font-size="11.5" fill="#5c6878" text-anchor="middle">unavailable checks are excluded from the score</text>
</svg>
