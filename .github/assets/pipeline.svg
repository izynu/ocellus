<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" preserveAspectRatio="xMidYMid meet" aria-label="A four stage scan flow, left to right: your browser sends requests; CORS-open public sources answer; 32 fixed checks resolve one at a time; a categorised report marks each check pass, warn, fail or unavailable. Small dots travel along the connector lines to show the direction of data flow.">
  <title>How a scan runs: browser, sources, checks, report</title>

  <style>
    /* One dot travelling each connector. A short dash on a long gap, with the
       offset animated, reads as a single dot moving rather than a marching
       dash. */
    .flow {
      stroke-dasharray: 5 55;
      animation: travel 2.6s linear infinite;
    }
    .flow-b { animation-delay: 0.65s; }
    .flow-c { animation-delay: 1.3s; }
    @keyframes travel {
      from { stroke-dashoffset: 60; }
      to   { stroke-dashoffset: 0; }
    }
    .arrow { animation: arrow-glow 2.6s ease-in-out infinite; }
    @keyframes arrow-glow {
      0%, 100% { opacity: 0.45; }
      50%      { opacity: 0.9; }
    }
    @media (prefers-reduced-motion: reduce) {
      .flow { animation: none; stroke-dasharray: none; stroke-opacity: 0.55; }
      .arrow { animation: none; opacity: 0.7; }
    }
  </style>

  <defs>
    <linearGradient id="pipe-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080c10"/>
      <stop offset="1" stop-color="#101820"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#pipe-bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="299" fill="none" stroke="#1c2730"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#5c6879" font-size="12" letter-spacing="1.5">
    <text x="32" y="34">01  REQUEST</text>
    <text x="332" y="34">02  SOURCES</text>
    <text x="632" y="34">03  CHECKS</text>
    <text x="932" y="34">04  REPORT</text>
  </g>

  <!-- Stage 1 -->
  <g transform="translate(32 58)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect width="248" height="196" rx="12" fill="#10151c" stroke="#1c2730"/>
    <text x="18" y="30" fill="#e8ecf2" font-size="16" font-weight="600">Your browser</text>
    <text x="18" y="52" fill="#94a1b2" font-size="12">Types a hostname, starts a scan.</text>
    <g font-size="12">
      <rect x="18" y="70" width="212" height="30" rx="7" fill="#080c10" stroke="#1c2730"/>
      <text x="30" y="90" fill="#c8d2df">No install, no account</text>
      <rect x="18" y="108" width="212" height="30" rx="7" fill="#080c10" stroke="#1c2730"/>
      <text x="30" y="128" fill="#c8d2df">No API key held</text>
      <rect x="18" y="146" width="212" height="30" rx="7" fill="#080c10" stroke="#1c2730"/>
      <text x="30" y="166" fill="#c8d2df">Requests leave the tab</text>
    </g>
    <text x="18" y="188" fill="#5c6879" font-size="11">Nothing is uploaded to a server.</text>
  </g>

  <!-- Connector 1 -->
  <g stroke="#38d2b6" stroke-width="1.5" fill="none">
    <path class="arrow" d="M292 156 H320"/>
    <path class="arrow" d="M312 150 L320 156 L312 162"/>
    <path class="flow" d="M292 156 H320"/>
  </g>

  <!-- Stage 2 -->
  <g transform="translate(332 58)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect width="248" height="196" rx="12" fill="#10151c" stroke="#1c2730"/>
    <text x="18" y="30" fill="#e8ecf2" font-size="16" font-weight="600">CORS-open sources</text>
    <text x="18" y="52" fill="#94a1b2" font-size="12">Public APIs answer your tab.</text>
    <g font-size="12">
      <rect x="18" y="70" width="212" height="30" rx="7" fill="#080c10" stroke="#1c2730"/>
      <text x="30" y="90" fill="#c8d2df">DNS over HTTPS, CT logs</text>
      <rect x="18" y="108" width="212" height="30" rx="7" fill="#080c10" stroke="#1c2730"/>
      <text x="30" y="128" fill="#c8d2df">Response headers, the page</text>
      <rect x="18" y="146" width="212" height="30" rx="7" fill="#080c10" stroke="#1c2730"/>
      <text x="30" y="166" fill="#c8d2df">Reputation and passive DNS</text>
    </g>
    <text x="18" y="188" fill="#5c6879" font-size="11">120 catalogued; 26 reachable in a page.</text>
  </g>

  <!-- Connector 2 -->
  <g stroke="#38d2b6" stroke-width="1.5" fill="none">
    <path class="arrow" d="M592 156 H620"/>
    <path class="arrow" d="M612 150 L620 156 L612 162"/>
    <path class="flow flow-b" d="M592 156 H620"/>
  </g>

  <!-- Stage 3 -->
  <g transform="translate(632 58)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect width="248" height="196" rx="12" fill="#10151c" stroke="#1c2730"/>
    <text x="18" y="30" fill="#e8ecf2" font-size="16" font-weight="600">32 checks</text>
    <text x="18" y="52" fill="#94a1b2" font-size="12">One question each, one at a time.</text>
    <g font-size="12.5">
      <circle cx="27" cy="78" r="4.5" fill="#56c98a"/>
      <text x="42" y="83" fill="#c8d2df">DNS records</text>
      <text x="228" y="83" fill="#56c98a" text-anchor="end" font-size="11">pass</text>

      <circle cx="27" cy="108" r="4.5" fill="#56c98a"/>
      <text x="42" y="113" fill="#c8d2df">Certificate transparency</text>
      <text x="228" y="113" fill="#56c98a" text-anchor="end" font-size="11">pass</text>

      <circle cx="27" cy="138" r="4.5" fill="#e0a33a"/>
      <text x="42" y="143" fill="#c8d2df">HTTP security headers</text>
      <text x="228" y="143" fill="#e0a33a" text-anchor="end" font-size="11">warn</text>

      <circle cx="27" cy="168" r="4.5" fill="#7b8798"/>
      <text x="42" y="173" fill="#c8d2df">Popularity rank</text>
      <text x="228" y="173" fill="#7b8798" text-anchor="end" font-size="11">unavailable</text>
    </g>
  </g>

  <!-- Connector 3 -->
  <g stroke="#38d2b6" stroke-width="1.5" fill="none">
    <path class="arrow" d="M892 156 H920"/>
    <path class="arrow" d="M912 150 L920 156 L912 162"/>
    <path class="flow flow-c" d="M892 156 H920"/>
  </g>

  <!-- Stage 4 -->
  <g transform="translate(932 58)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect width="236" height="196" rx="12" fill="#10151c" stroke="#1c2730"/>
    <text x="18" y="30" fill="#e8ecf2" font-size="16" font-weight="600">Categorised report</text>
    <text x="18" y="52" fill="#94a1b2" font-size="12">Grouped, scored, exportable.</text>
    <g font-size="11">
      <rect x="18" y="70" width="94" height="52" rx="8" fill="#080c10" stroke="#1c2730"/>
      <circle cx="32" cy="86" r="4" fill="#56c98a"/>
      <text x="44" y="90" fill="#94a1b2">pass</text>
      <text x="30" y="112" fill="#c8d2df" font-size="15" font-weight="600">weight 1.00</text>

      <rect x="122" y="70" width="94" height="52" rx="8" fill="#080c10" stroke="#1c2730"/>
      <circle cx="136" cy="86" r="4" fill="#e0a33a"/>
      <text x="148" y="90" fill="#94a1b2">warn</text>
      <text x="134" y="112" fill="#c8d2df" font-size="15" font-weight="600">weight 0.55</text>

      <rect x="18" y="130" width="94" height="52" rx="8" fill="#080c10" stroke="#1c2730"/>
      <circle cx="32" cy="146" r="4" fill="#ef6a72"/>
      <text x="44" y="150" fill="#94a1b2">fail</text>
      <text x="30" y="172" fill="#c8d2df" font-size="15" font-weight="600">weight 0.10</text>

      <rect x="122" y="130" width="94" height="52" rx="8" fill="#080c10" stroke="#1c2730"/>
      <circle cx="136" cy="146" r="4" fill="#7b8798"/>
      <text x="148" y="150" fill="#94a1b2">unavailable</text>
      <text x="134" y="172" fill="#c8d2df" font-size="15" font-weight="600">removed</text>
    </g>
  </g>

  <text x="32" y="284" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#5c6879" font-size="12">A check that could not run is removed from the score, never counted as a pass. A partial scan is reported as partial.</text>
</svg>
