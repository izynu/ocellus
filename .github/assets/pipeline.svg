<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" preserveAspectRatio="xMidYMid meet" aria-label="A scan runs in three stages. Your browser asks public sources. The checks resolve one at a time, each landing as its source answers. The report shows what passed, what warned, what failed and what could not run, and nothing that could not run is counted as a pass.">
  <title>How a scan runs: sources, checks, report</title>

  <rect width="1200" height="300" fill="#0b0e13"/>
  <rect x="0.5" y="0.5" width="1199" height="299" fill="none" stroke="#232b36"/>

  <!-- Stage labels across the top. -->
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="40" y="40" fill="#5a6676" font-size="12" letter-spacing="1.6">01  SOURCES</text>
    <text x="430" y="40" fill="#5a6676" font-size="12" letter-spacing="1.6">02  CHECKS</text>
    <text x="820" y="40" fill="#5a6676" font-size="12" letter-spacing="1.6">03  REPORT</text>
  </g>

  <!--   Stage 1: your browser asks public sources   -->
  <g transform="translate(40 62)" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <rect x="0" y="0" width="330" height="196" rx="12" fill="#10151c" stroke="#232b36"/>
    <text x="18" y="28" fill="#e8ecf2" font-size="15" font-weight="600">Your browser</text>
    <text x="18" y="48" fill="#94a1b2" font-size="12">Queries each source directly.</text>

    <!-- Three source chips, named for what they answer. -->
    <g font-size="12">
      <rect x="18" y="64" width="138" height="30" rx="7" fill="#0b0e13" stroke="#232b36"/>
      <text x="30" y="84" fill="#c8d2df">DNS over HTTPS</text>

      <rect x="174" y="64" width="138" height="30" rx="7" fill="#0b0e13" stroke="#232b36"/>
      <text x="186" y="84" fill="#c8d2df">CT logs</text>

      <rect x="18" y="102" width="138" height="30" rx="7" fill="#0b0e13" stroke="#232b36"/>
      <text x="30" y="122" fill="#c8d2df">Response headers</text>

      <rect x="174" y="102" width="138" height="30" rx="7" fill="#0b0e13" stroke="#232b36"/>
      <text x="186" y="122" fill="#c8d2df">The page</text>

      <rect x="18" y="140" width="138" height="30" rx="7" fill="#0b0e13" stroke="#232b36"/>
      <text x="30" y="160" fill="#c8d2df">Reputation feeds</text>

      <rect x="174" y="140" width="138" height="30" rx="7" fill="#0b0e13" stroke="#232b36"/>
      <text x="186" y="160" fill="#c8d2df">Passive DNS</text>
    </g>
    <text x="18" y="186" fill="#5a6676" font-size="11">CORS is required. No key is used.</text>
  </g>

  <!-- Arrow 1 -->
  <g stroke="#4fd1c5" stroke-width="1.5" fill="none" opacity="0.75">
    <path d="M378 160 H412"/>
    <path d="M404 154 L412 160 L404 166"/>
  </g>

  <!--   Stage 2: checks resolve one at a time   -->
  <g transform="translate(420 62)" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <rect x="0" y="0" width="330" height="196" rx="12" fill="#10151c" stroke="#232b36"/>
    <text x="18" y="28" fill="#e8ecf2" font-size="15" font-weight="600">Checks resolve</text>
    <text x="18" y="48" fill="#94a1b2" font-size="12">One at a time, as each source answers.</text>

    <!-- Four check rows, each with a status dot. -->
    <g font-size="12.5">
      <circle cx="26" cy="74" r="4.5" fill="#56c98a"/>
      <text x="40" y="79" fill="#c8d2df">DNS records</text>
      <text x="288" y="79" fill="#56c98a" text-anchor="end" font-size="11">pass</text>

      <circle cx="26" cy="104" r="4.5" fill="#56c98a"/>
      <text x="40" y="109" fill="#c8d2df">Certificates</text>
      <text x="288" y="109" fill="#56c98a" text-anchor="end" font-size="11">pass</text>

      <circle cx="26" cy="134" r="4.5" fill="#e0a33a"/>
      <text x="40" y="139" fill="#c8d2df">Security headers</text>
      <text x="288" y="139" fill="#e0a33a" text-anchor="end" font-size="11">warn</text>

      <circle cx="26" cy="164" r="4.5" fill="#7b8798"/>
      <text x="40" y="169" fill="#c8d2df">Popularity rank</text>
      <text x="288" y="169" fill="#7b8798" text-anchor="end" font-size="11">unavailable</text>
    </g>
  </g>

  <!-- Arrow 2 -->
  <g stroke="#4fd1c5" stroke-width="1.5" fill="none" opacity="0.75">
    <path d="M758 160 H792"/>
    <path d="M784 154 L792 160 L784 166"/>
  </g>

  <!--   Stage 3: the report   -->
  <g transform="translate(810 62)" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <rect x="0" y="0" width="350" height="196" rx="12" fill="#10151c" stroke="#232b36"/>
    <text x="18" y="28" fill="#e8ecf2" font-size="15" font-weight="600">The report</text>
    <text x="18" y="48" fill="#94a1b2" font-size="12">Measured, separated from missing.</text>

    <!-- Four status columns with a count each. The counts are illustrative of a
         shape, not a claim about any site: the note below says so. -->
    <g font-size="11">
      <rect x="18" y="66" width="74" height="76" rx="8" fill="#0b0e13" stroke="#232b36"/>
      <circle cx="34" cy="84" r="4" fill="#56c98a"/>
      <text x="46" y="88" fill="#94a1b2">pass</text>
      <text x="34" y="126" fill="#56c98a" font-size="24" font-weight="600">21</text>

      <rect x="100" y="66" width="74" height="76" rx="8" fill="#0b0e13" stroke="#232b36"/>
      <circle cx="116" cy="84" r="4" fill="#e0a33a"/>
      <text x="128" y="88" fill="#94a1b2">warn</text>
      <text x="116" y="126" fill="#e0a33a" font-size="24" font-weight="600">5</text>

      <rect x="182" y="66" width="74" height="76" rx="8" fill="#0b0e13" stroke="#232b36"/>
      <circle cx="198" cy="84" r="4" fill="#ef6a72"/>
      <text x="210" y="88" fill="#94a1b2">fail</text>
      <text x="198" y="126" fill="#ef6a72" font-size="24" font-weight="600">2</text>

      <rect x="264" y="66" width="68" height="76" rx="8" fill="#0b0e13" stroke="#232b36"/>
      <circle cx="280" cy="84" r="4" fill="#7b8798"/>
      <text x="292" y="88" fill="#94a1b2">n/a</text>
      <text x="280" y="126" fill="#7b8798" font-size="24" font-weight="600">4</text>
    </g>

    <text x="18" y="166" fill="#94a1b2" font-size="12">The score covers the checks that ran.</text>
    <text x="18" y="184" fill="#5a6676" font-size="11">An unavailable check is never counted as a pass.</text>
  </g>
</svg>
