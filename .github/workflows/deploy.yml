name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages needs these three permissions, and nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. `cancel-in-progress: false` because cancelling a Pages
# deployment halfway can leave the environment reporting a failed run that the
# next push then has to overwrite.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - run: npx tsc --noEmit

      # The base path has to match the repository name, otherwise every asset
      # 404s. GITHUB_REPOSITORY is "owner/name", so take the name half.
      - name: Build the Pages target
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io', github.repository_owner) }}
          OC_PAGES_BASE: /${{ github.event.repository.name }}
        run: node scripts/build.mjs pages

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
