<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Ocellus">
  <!--
    The mark is an ocellus: the simple eye of an insect, a single lens that
    resolves light from dark rather than an image. One ring, one pupil, one
    specular highlight. Drawn on a rounded square so it holds up at 16px.

    Colours are the site tokens: --background #080c10 and --primary #38d2b6.
    Keeping them literal is deliberate, because a favicon has no stylesheet.
  -->
  <rect width="64" height="64" rx="14" fill="#080c10"/>
  <circle cx="32" cy="32" r="19.5" fill="none" stroke="#38d2b6" stroke-opacity="0.32" stroke-width="3"/>
  <circle cx="32" cy="32" r="12.5" fill="none" stroke="#38d2b6" stroke-width="3"/>
  <circle cx="32" cy="32" r="5.2" fill="#38d2b6"/>
  <circle cx="29.4" cy="29.4" r="1.7" fill="#080c10" fill-opacity="0.75"/>
</svg>
