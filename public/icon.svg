<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Ocellus">
  <!--
    The mark is an ocellus: the simple eye of an insect, a single lens that
    resolves light from dark rather than an image. One ring, one pupil, one
    specular highlight. Drawn on a rounded square so it holds up at 16px.
  -->
  <rect width="64" height="64" rx="14" fill="#0b0e13"/>
  <circle cx="32" cy="32" r="19.5" fill="none" stroke="#4fd1c5" stroke-opacity="0.30" stroke-width="3"/>
  <circle cx="32" cy="32" r="12.5" fill="none" stroke="#4fd1c5" stroke-width="3"/>
  <circle cx="32" cy="32" r="5.2" fill="#4fd1c5"/>
  <circle cx="29.4" cy="29.4" r="1.7" fill="#0b0e13" fill-opacity="0.75"/>
</svg>
